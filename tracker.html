   /* часы */ 
 .header-row {
  display: flex;
  align-items: center;      /* часы по центру высоты заголовка */
  gap: 16px;
  padding: 12px;
  touch-action: none;       /* важно: без этого телефон "заберёт" свайп себе */
  cursor: grab;
}

#clock {
  width: clamp(56px, 14vw, 120px);  /* адаптивный размер */

}

h1 { margin: 0; font-size: clamp(1.3rem, 5vw, 2.5rem); }

    
  </style>

<body>

<div class="container">

 <div id="mor" style="display: flex; align-items: center; gap: 16px; padding: 12px; cursor: pointer;">
  <canvas id="clock"></canvas>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
  <span><h1>TRACKER</h1></span>
</div>

 
  <!-- =====================================================
       ПОЧАТКОВІ ДАНІ
       Зберігаються тільки на цьому пристрої.
       ===================================================== -->

  <div class="card">
  
  <div id="ser" style="cursor: pointer; padding: 12px; text-align: center; color: #666;">
  <p class="footer">
    <span><h2>Початкові дані&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;✔️</h2></span>
  </p>
</div>

    <label for="startDate">Дата початку контролю</label>
    <input type="date" id="startDate">

    <label for="startVal">Початкове показання</label>
    <input type="number" id="startVal" min="0" step="1">

    <button onclick="saveStartData()">Зберегти початкові дані</button>

    <div id="savedInfo" class="info" style="display:none;"></div>

    <button
      id="editButton"
      class="secondary"

    </button>

    <div id="transferButtons" style="display:none;">
      <button class="secondary" onclick="exportData()">
        Експорт даних (файл)
      </button>
      <button class="secondary" onclick="document.getElementById('importFile').click()">
        Імпорт даних (файл)
      </button>
      <input
        type="file"
        id="importFile"
        accept=".json,application/json"
        style="display:none;"
        onchange="importData(this)">
    </div>

  </div>


  <!-- =====================================================
       ПОТОЧНІ ДАНІ
       Не зберігаються.
       ===================================================== -->

  <div class="card">
  <div id="TR" style="cursor: pointer; padding: 12px; text-align: center; color: #666;">
  <p class="footer">
    <span><h2>Поточні дані&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;✔️</h2></span>
  </p>
</div>

    

    <label for="currentDate">Поточна дата</label>
    <input type="date" id="currentDate">

    <label for="currentVal">Поточне показання</label>
    <input type="number" id="currentVal" min="0" step="1">

       РЕЗУЛЬТАТ
       ===================================================== -->

  </div>


  <div class="footer">
    Початкові дані зберігаються тільки в цьому браузері.
  </div>

</div>


<script>
"use strict";

/*
============================================================
TRACKER — веб-версія
============================================================

Логіка відповідає робочому tracker.sh:

1. Початкова дата і початкове показання задаються один раз.
2. Вони зберігаються локально на пристрої.
3. Поточна дата і поточне показання НЕ зберігаються.
4. Кожен розрахунок виконується від початкових даних.
5. Норма = 4 години на кожен день.
6. Середнє = використано / кількість днів.

============================================================
*/


// Ключ, під яким початкові дані зберігаються в браузері.
const STORAGE_KEY = "tracker_start_data";


// ----------------------------------------------------------
// Допоміжна функція: сьогоднішня дата
// ----------------------------------------------------------

function todayISO() {
  const now = new Date();

  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


// ----------------------------------------------------------
// Отримання дати без проблем з часовими поясами
// ----------------------------------------------------------

function parseDate(dateString) {
  const parts = dateString.split("-");

  if (parts.length !== 3) {
    return null;
  }

  const year = Number(parts[0]);
  const month = Number(parts[1]);
  const day = Number(parts[2]);

  const date = new Date(year, month - 1, day);

  if (
    date.getFullYear() !== year ||
    date.getMonth() !== month - 1 ||
    date.getDate() !== day
  ) {
    return null;
  }

  return date;
}


// ----------------------------------------------------------
// Показати помилку
// ----------------------------------------------------------

function showError(message) {
  const error = document.getElementById("error");

  error.textContent = message;
  error.style.display = "block";
}


// ----------------------------------------------------------
// Сховати помилку
// ----------------------------------------------------------

function hideError() {
  const error = document.getElementById("error");

  error.textContent = "";
  error.style.display = "none";
}


// ----------------------------------------------------------
// Завантажити збережені початкові дані
// ----------------------------------------------------------

function loadStartData() {

  const saved = localStorage.getItem(STORAGE_KEY);

  if (!saved) {
    document.getElementById("startDate").value = todayISO();
    return;
  }

  try {

    const data = JSON.parse(saved);

    document.getElementById("startDate").value = data.date;
    document.getElementById("startVal").value = data.value;

    document.getElementById("startDate").disabled = true;
    document.getElementById("startVal").disabled = true;

    document.querySelector(
      'button[onclick="saveStartData()"]'
    ).style.display = "none";

    document.getElementById("editButton").style.display = "block";

    document.getElementById("transferButtons").style.display = "block";

    document.getElementById("savedInfo").innerHTML =
      `<strong>Збережено:</strong><br>
       ${data.date}<br>
       Початкове показання: ${data.value}`;

    document.getElementById("savedInfo").style.display = "block";

  } catch (error) {

    localStorage.removeItem(STORAGE_KEY);

    document.getElementById("startDate").value = todayISO();
  }
}


// ----------------------------------------------------------
// Зберегти початкові дані
// ----------------------------------------------------------

function saveStartData() {

  hideError();

  const date = document.getElementById("startDate").value;
  const value = document.getElementById("startVal").value.trim();

  if (!date) {
    showError("Вкажіть початкову дату.");
    return;
  }

  if (value === "" || !/^[0-9]+$/.test(value)) {
    showError("Початкове показання повинно бути цілим числом.");
    return;
  }

  if (!parseDate(date)) {
    showError("Початкова дата некоректна.");
    return;
  }

  const data = {
    date: date,
    value: Number(value)
  };

  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

  loadStartData();

  document.getElementById("savedInfo").innerHTML =
    `<strong>Початкові дані збережено.</strong><br>
     ${date}<br>
     Початкове показання: ${value}`;

  document.getElementById("savedInfo").style.display = "block";
}


// ----------------------------------------------------------
// Дозволити зміну початкових даних
//
// Використовувати тільки якщо дійсно потрібно змінити
// вихідну точку.
// ----------------------------------------------------------

function enableEditing() {

  document.getElementById("startDate").disabled = false;
  document.getElementById("startVal").disabled = false;

  document.querySelector(
    'button[onclick="saveStartData()"]'
  ).style.display = "block";

  document.getElementById("editButton").style.display = "none";
}


// ----------------------------------------------------------
// Експорт початкових даних у файл
// ----------------------------------------------------------

function exportData() {

  hideError();

  const saved = localStorage.getItem(STORAGE_KEY);

  if (!saved) {
    showError("Немає даних для експорту.");
    return;
  }

  const blob = new Blob([saved], {
    type: "application/json"
  });

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");

  link.href = url;
  link.download = "tracker-data.json";

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  URL.revokeObjectURL(url);
}


// ----------------------------------------------------------
// Імпорт початкових даних із файлу
// ----------------------------------------------------------

function importData(input) {

  hideError();

  const file = input.files[0];

  if (!file) {
    return;
  }

  const reader = new FileReader();

  reader.onload = function () {

    let data;

    try {
      data = JSON.parse(reader.result);
    } catch (error) {
      showError("Файл пошкоджений або не є JSON.");
      input.value = "";
      return;
    }

    if (
      !data ||
      typeof data.date !== "string" ||
      !parseDate(data.date) ||
      typeof data.value !== "number" ||
      !Number.isInteger(data.value) ||
      data.value < 0
    ) {
      showError("У файлі некоректні дані.");
      input.value = "";
      return;
    }

    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

    loadStartData();

    document.getElementById("savedInfo").innerHTML =
      `<strong>Дані імпортовано.</strong><br>
       ${data.date}<br>
       Початкове показання: ${data.value}`;

    document.getElementById("savedInfo").style.display = "block";

    input.value = "";
  };

  reader.readAsText(file);
}


// ----------------------------------------------------------
// Основний розрахунок
// ----------------------------------------------------------

function calculate() {

  hideError();

  const saved = localStorage.getItem(STORAGE_KEY);

  if (!saved) {
    showError("Спочатку збережіть початкові дані.");
    return;
  }

  let startData;

  try {
    startData = JSON.parse(saved);
  } catch (error) {
    showError("Не вдалося прочитати початкові дані.");
    return;
  }


  const currentDateString =
    document.getElementById("currentDate").value;

  const currentValueString =
    document.getElementById("currentVal").value.trim();


  if (!currentDateString) {
    showError("Вкажіть поточну дату.");
    return;
  }

  if (
    currentValueString === "" ||
    !/^[0-9]+$/.test(currentValueString)
  ) {
    showError("Поточне показання повинно бути цілим числом.");
    return;
  }


  const startDate = parseDate(startData.date);
  const currentDate = parseDate(currentDateString);

  if (!startDate || !currentDate) {
    showError("Одна з дат некоректна.");
    return;
  }


  const startValue = Number(startData.value);
  const currentValue = Number(currentValueString);


  // --------------------------------------------------------
  // Кількість днів
  // --------------------------------------------------------

  const millisecondsPerDay = 86400000;

  const days = Math.floor(
    (currentDate - startDate) / millisecondsPerDay
  );


  if (days <= 0) {
    showError(
      "Поточна дата повинна бути пізніше стартової."
    );
    return;
  }


  // --------------------------------------------------------
  // Використано всього
  // --------------------------------------------------------

  const used = currentValue - startValue;


  if (used < 0) {
    showError(
      "Поточне показання не може бути меншим за початкове."
    );
    return;
  }


  // --------------------------------------------------------
  // Середнє за добу
  // --------------------------------------------------------

  const average = used / days;


  // --------------------------------------------------------
  // Норма
  // --------------------------------------------------------

  const expected = days * 4;


  // --------------------------------------------------------
  // Відхилення від норми
  // --------------------------------------------------------

  const difference = used - expected;


  // --------------------------------------------------------
  // Вивід результатів
  // --------------------------------------------------------

  document.getElementById("daysResult").textContent =
    days;

  document.getElementById("usedResult").textContent =
    `${used} год`;

  document.getElementById("averageResult").textContent =
    `${average.toFixed(2)} год`;


  const status = document.getElementById("status");


  if (used >= expected) {

    status.className = "status normal";

    status.innerHTML =
      `СТАТУС: НОРМА!<br>
       <small>Потрібно: ${expected} год</small><br>
       Запас: +${difference} год`;

  } else {

    const deficit = Math.abs(difference);

    status.className = "status behind";

    status.innerHTML =
      `СТАТУС: ВІДСТАВАННЯ!<br>
       <small>Потрібно: ${expected} год</small><br>
       Не вистачає: -${deficit} год`;
  }


  document.getElementById("result").style.display = "block";

  // Прокрутка до результату.
  document.getElementById("result").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}


// ----------------------------------------------------------
// Ініціалізація сторінки
// ----------------------------------------------------------

document.getElementById("currentDate").value = todayISO();

loadStartData();

</script>
<script>
const canvas = document.getElementById('clock');
const ctx = canvas.getContext('2d');

// --- рисуем в высоком качестве (для ретины) ---
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cssSize = canvas.clientWidth;
  canvas.width = canvas.height = Math.round(cssSize * dpr);
  tick();
}

function hand(angleDeg, length, width, color) {
  const a = (angleDeg - 90) * Math.PI / 180;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(c, c);
  ctx.lineTo(c + Math.cos(a) * length, c + Math.sin(a) * length);
  ctx.stroke();
}

let c; // центр, пересчитывается при каждом рисовании
function tick() {
  const size = canvas.width;
  c = size / 2;
  const now = new Date();
  const s = now.getSeconds() + now.getMilliseconds() / 1000;
  const m = now.getMinutes() + s / 60;
  const h = (now.getHours() % 12) + m / 60;
  const k = size / 200; // масштаб от базовых 200px

  ctx.clearRect(0, 0, size, size);

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(c, c, c - 6 * k, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 2 * k;
  ctx.stroke();

  // метки часов
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 2 * k;
  for (let i = 0; i < 12; i++) {
    const a = i * 30 * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(c + Math.cos(a) * (c - 12 * k), c + Math.sin(a) * (c - 12 * k));
    ctx.lineTo(c + Math.cos(a) * (c - 6 * k), c + Math.sin(a) * (c - 6 * k));
    ctx.stroke();
  }

  hand(h * 30, c * 0.45, 6 * k, '#000');   // часовая
  hand(m * 6,  c * 0.7,  4 * k, '#000');   // минутная
  hand(s * 6,  c * 0.78, 1.5 * k, '#e74c3c'); // секундная — плавный ход!

  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(c, c, 4 * k, 0, Math.PI * 2);
  ctx.fill();

  requestAnimationFrame(tick); // плавная анимация
}

window.addEventListener('resize', resize);
resize();

// --- перетаскивание блока "часы + заголовок" ---
const row = document.getElementById('headerRow');
let startX, startY, ox = 0, oy = 0, dragging = false;

row.addEventListener('pointerdown', e => {
  dragging = true;
  startX = e.clientX - ox;
  startY = e.clientY - oy;
  row.style.cursor = 'grabbing';
  row.setPointerCapture(e.pointerId);
});
row.addEventListener('pointermove', e => {
  if (!dragging) return;
  ox = e.clientX - startX;
  oy = e.clientY - startY;
  row.style.transform = `translate(${ox}px, ${oy}px)`;
});
row.addEventListener('pointerup', () => {
  dragging = false;
  row.style.cursor = 'grab';
});
</script>
<script>

let clicks = 0;
const counters = {};

const el = document.getElementById("ser");
if (el) {
  el.onclick = () => {
    clicks++;
    if (clicks >= 3) {
      window.open("https://github.com/alexey-kolmakov", "_blank");
    }

const mor = document.getElementById("mor");
if (mor) {
  mor.onclick = () => {
    counters["mor"] = (counters["mor"] || 0) + 1;
    if (counters["mor"] >= 5) {
      window.open("https://alexey-kolmakov.github.io/Omnichannel/mybuild.html", "_blank");
    }
  };
}

const tr = document.getElementById("TR");
if (tr) {
  tr.onclick = () => {
    counters["TR"] = (counters["TR"] || 0) + 1;
    if (counters["TR"] >= 5) {
      window.open("https://github.com/alexey-kolmakov", "_blank");
    }
  };
}
</script>
