.header-row {
  display: flex;
  align-items: center;      /* часы по центру высоты заголовка */
  gap: 16px;
  padding: 12px;
}

#clock {
  width: clamp(40px, 14vw, 60px);  /* адаптивный размер */
  height: auto;
  aspect-ratio: 1;                   /* всегда квадрат */
  flex-shrink: 0;
}
#clock {
  margin-top: 6px;     /* сдвинуть ВВЕРХ на 20px */
  margin-bottom: -80px;   /* сдвинуть ВНИЗ (отодвинуть то, что под ним) */
  margin-left: 2px;     /* сдвинуть ВПРАВО на 40px */
  margin-right: 20px;    /* отодвинуть то, что слева, = сдвиг влево */
}

h1 { margin: 0; font-size: clamp(1.3rem, 5vw, 2.5rem); }

         {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 1.6rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.85);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 10px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 80%;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }

    width: 36px;
    height: 36px;
    object-fit: contain;     /* вписывает картинку в квадрат без искажений */

    padding: 6px;            /* отступ внутри квадратика */
}

            font-size: 1.0rem;
            margin-bottom: 8px; //рассточние между строками
            color: #1a1a2e;
        }

            font-size: 0.90rem;
            color: #666;
            line-height: 0.2; //размер карточки по вертикали

        }

        .card-green .card-icon { background: #e8f5e9; color: #4caf50; }
        .card-green .tag { background: #e8f5e9; color: #4caf50; }

<script>
const canvas = document.getElementById('clock');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cssSize = canvas.clientWidth;
  canvas.width = canvas.height = Math.round(cssSize * dpr);
}

function hand(angleDeg, length, width, color) {
  const a = (angleDeg - 90) * Math.PI / 180;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(c, c);
  ctx.lineTo(c + Math.cos(a) * length, c + Math.sin(a) * length);
  ctx.stroke();
}

let c;
function tick() {
  const size = canvas.width;
  c = size / 2;
  const now = new Date();
  const s = now.getSeconds() + now.getMilliseconds() / 1000;
  const m = now.getMinutes() + s / 60;
  const h = (now.getHours() % 12) + m / 60;
  const k = size / 200;

  ctx.clearRect(0, 0, size, size);

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(c, c, c - 6 * k, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 2 * k;
  ctx.stroke();

  ctx.strokeStyle = '#999';
  ctx.lineWidth = 2 * k;
  for (let i = 0; i < 12; i++) {
    const a = i * 30 * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(c + Math.cos(a) * (c - 12 * k), c + Math.sin(a) * (c - 12 * k));
    ctx.lineTo(c + Math.cos(a) * (c - 6 * k), c + Math.sin(a) * (c - 6 * k));
    ctx.stroke();
  }

  hand(h * 30, c * 0.45, 6 * k, '#000');
  hand(m * 6,  c * 0.7,  4 * k, '#000');
  hand(s * 6,  c * 0.78, 1.5 * k, '#e74c3c');

  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(c, c, 4 * k, 0, Math.PI * 2);
  ctx.fill();

  requestAnimationFrame(tick);
}

window.addEventListener('resize', resize);
resize();
tick();
</script>

        window.open("https://alexey-kolmakov.github.io/Omnichannel/mybuild.html"), "_blank";

    if (e.shiftKey) {

});
   // початок карток window.open("https://alexey-kolmakov.github.io/workshop/contact.html", "_blank");
});


// Телефон

let taps = 0;
let timer;


// двойной и тройной тап

logo.addEventListener("touchstart", () => {

    taps++;

    clearTimeout(timer);

    timer = setTimeout(() => {

        if (taps === 2) {
            window.open("https://alexey-kolmakov.github.io/workshop/contact.html", "_blank");
        }

        if (taps === 3) {
            window.open("https://alexey-kolmakov.github.io/Omnichannel/tracker.html", "_blank");
        }

        taps = 0;

    }, 500);
});


// долгое удержание

let holdTimer;

logo.addEventListener("touchstart", () => {

    holdTimer = setTimeout(() => {
        window.open("");
    }, 2000);

});

logo.addEventListener("touchend", () => {

    clearTimeout(holdTimer);

});
</script>
